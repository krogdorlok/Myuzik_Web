[project]
name = "myuzik-api"
version = "1.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "python-multipart==0.0.33",
  "sqlalchemy[asyncio]==2.1.6",
  "asyncpg==0.32.0",
  "alembic==1.20.1",
  "pyjwt==2.15.1",
  "bcrypt==5.0.0",
  "pydantic-settings==2.16.2",
  "email-validator==2.3.0",
  "httpx==0.28.1",
  "numpy==2.4.6",
  "soundfile==0.14.0",
  "soxr==1.1.0",
  "ai-edge-litert==2.3.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "aiosqlite==0.22.1", "ruff==0.17.3"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
